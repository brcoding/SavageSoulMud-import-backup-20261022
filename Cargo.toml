[workspace]
resolver = "2"
# Bare `cargo run` / `cargo build` default to the example MUD. Whole-workspace
# operations (CI) still use `--workspace` explicitly.
default-members = ["crates/example-mud"]
members = ["crates/*"]

[workspace.dependencies]
bevy = { version = "0.19", default-features = false, features = ["bevy_log"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
nanoid = "0.4"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
signal-hook = "0.3"
sendfd = "0.4"
sd-notify = "0.5"
rustix = { version = "1", features = ["fs"] }